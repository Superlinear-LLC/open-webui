name: Release to PyPI

# DISABLED IN THIS FORK. Upstream ships this to publish the `open-webui`
# project to PyPI via trusted publishing, on every push to main. A fork must
# never attempt that: it would be an attempted publish of modified code under
# upstream's package name.
#
# It has run on every push to this fork's main and FAILED every time, including
# 2026-08-27 — PyPI's trusted publisher for `open-webui` is bound to upstream's
# repository, so the OIDC claim from this fork does not match and nothing was
# ever published. That is the only reason it stayed harmless, and it is not a
# control we own. Turned off so it is not attempted at all.
on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/open-webui
    permissions:
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install Git
        run: sudo apt-get update && sudo apt-get install -y git
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: 3.11
      - name: Build
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build .
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
